# Local / CI cluster (kind).
image:
  repository: telemetry-stream
  tag: ci
  pullPolicy: Never

env:
  KAFKA_BOOTSTRAP: kafka:9092
  MONGO_URI: mongodb://mongo:27017/telemetry
  CONSUMER_THREADS: "1"

replicaCount: 1
autoscaling:
  enabled: false
pdb:
  enabled: false
topologySpread:
  enabled: false
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 640Mi }
