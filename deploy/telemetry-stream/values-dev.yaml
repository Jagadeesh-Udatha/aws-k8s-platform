# EKS dev. MongoDB runs on MongoDB Atlas (private endpoint); its URI is pasted into Secrets Manager once.
externalSecret:
  enabled: true
  data:
    - { envVar: KAFKA_BOOTSTRAP, remoteKey: telemetry/dev, property: kafka_bootstrap }
    - { envVar: MONGO_URI, remoteKey: telemetry/dev/mongo, property: mongo_uri }

env:
  SPRING_KAFKA_SECURITY_PROTOCOL: SSL

autoscaling:
  minReplicas: 1
  maxReplicas: 3
pdb:
  enabled: false
