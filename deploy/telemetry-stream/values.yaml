# Telemetry Stream: Kafka batch consumer writing GPS events to MongoDB, with a read API.
image:
  repository: ghcr.io/jagadeesh-udatha/telemetry-stream

env:
  SPRING_PROFILES_ACTIVE: json     # ECS-format JSON logs for CloudWatch / ELK
  CONSUMER_THREADS: "2"

# telemetry.raw has 12 partitions: more than 12 consumers would sit idle, so 12 / CONSUMER_THREADS = 6 pods max.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilization: 70
  scaleDownStabilizationSeconds: 300   # avoid consumer-group rebalance storms from flapping

pdb:
  minAvailable: 1

# Let the in-flight batch finish and offsets commit before SIGKILL.
terminationGracePeriodSeconds: 45

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 768Mi }
