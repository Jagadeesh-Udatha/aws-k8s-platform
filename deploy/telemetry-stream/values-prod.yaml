# EKS prod.
externalSecret:
  enabled: true
  data:
    - { envVar: KAFKA_BOOTSTRAP, remoteKey: telemetry/prod, property: kafka_bootstrap }
    - { envVar: MONGO_URI, remoteKey: telemetry/prod/mongo, property: mongo_uri }

env:
  SPRING_KAFKA_SECURITY_PROTOCOL: SSL
  CONSUMER_THREADS: "2"

autoscaling:
  minReplicas: 3
  maxReplicas: 6
pdb:
  minAvailable: 2

resources:
  requests: { cpu: 500m, memory: 768Mi }
  limits: { memory: 1Gi }

networkPolicy:
  enabled: true
  allowNamespaces:
    - kubernetes.io/metadata.name: monitoring

metrics:
  serviceMonitor: true
