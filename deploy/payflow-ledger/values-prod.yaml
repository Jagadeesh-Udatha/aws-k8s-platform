# EKS prod. image.repository and image.tag (the git SHA) are set by the deploy workflow.
externalSecret:
  enabled: true
  data:
    - { envVar: DB_URL, remoteKey: payflow/prod, property: db_url }
    - { envVar: DB_USER, remoteKey: payflow/prod, property: db_user }
    - { envVar: DB_PASSWORD, remoteKey: payflow/prod, property: db_password }
    - { envVar: KAFKA_BOOTSTRAP, remoteKey: payflow/prod, property: kafka_bootstrap }
    - { envVar: PAYFLOW_JWT_SECRET, remoteKey: payflow/prod, property: jwt_secret }
    - { envVar: PAYFLOW_OPS_PASSWORD, remoteKey: payflow/prod, property: ops_password }
    - { envVar: PAYFLOW_AUDITOR_PASSWORD, remoteKey: payflow/prod, property: auditor_password }

env:
  SPRING_KAFKA_SECURITY_PROTOCOL: SSL
  PAYFLOW_ALLOWED_ORIGIN: https://payflow.example.com

autoscaling:
  minReplicas: 3          # one per AZ
  maxReplicas: 8          # 8 x 20 Hikari connections = 160, under max_connections on db.r6g.large
pdb:
  minAvailable: 2

resources:
  requests: { cpu: 500m, memory: 768Mi }
  limits: { memory: 1Gi }

networkPolicy:
  enabled: true
  allowNamespaces:
    - kubernetes.io/metadata.name: kube-system   # AWS Load Balancer Controller health checks
    - kubernetes.io/metadata.name: monitoring

metrics:
  serviceMonitor: true

ingress:
  enabled: true
  className: alb
  host: api.payflow.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: platform-prod
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
