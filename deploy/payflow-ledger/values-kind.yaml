# Local / CI cluster (kind): image loaded with `kind load`, dependencies from dev/deps.yaml.
image:
  repository: payflow-ledger
  tag: ci
  pullPolicy: Never

env:
  DB_URL: jdbc:postgresql://postgres:5432/payflow
  KAFKA_BOOTSTRAP: kafka:9092

secret:
  create: true
  data:
    DB_USER: payflow
    DB_PASSWORD: payflow
    PAYFLOW_JWT_SECRET: kind-only-secret-0123456789abcdef0123456789
    PAYFLOW_OPS_PASSWORD: ops-kind-password
    PAYFLOW_AUDITOR_PASSWORD: auditor-kind-password

replicaCount: 1
autoscaling:
  enabled: false
pdb:
  enabled: false
topologySpread:
  enabled: false
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 640Mi }
