# EKS dev. image.repository is set by the deploy workflow from the Terraform ECR output.
externalSecret:
  enabled: true
  data:
    - { envVar: DB_URL, remoteKey: payflow/dev, property: db_url }
    - { envVar: DB_USER, remoteKey: payflow/dev, property: db_user }
    - { envVar: DB_PASSWORD, remoteKey: payflow/dev, property: db_password }
    - { envVar: KAFKA_BOOTSTRAP, remoteKey: payflow/dev, property: kafka_bootstrap }
    - { envVar: PAYFLOW_JWT_SECRET, remoteKey: payflow/dev, property: jwt_secret }
    - { envVar: PAYFLOW_OPS_PASSWORD, remoteKey: payflow/dev, property: ops_password }
    - { envVar: PAYFLOW_AUDITOR_PASSWORD, remoteKey: payflow/dev, property: auditor_password }

env:
  SPRING_KAFKA_SECURITY_PROTOCOL: SSL   # MSK client traffic is TLS-only
  PAYFLOW_ALLOWED_ORIGIN: https://payflow.dev.example.com

autoscaling:
  minReplicas: 1
  maxReplicas: 3
pdb:
  enabled: false

ingress:
  enabled: true
  className: alb
  host: api.payflow.dev.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: platform-dev
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
