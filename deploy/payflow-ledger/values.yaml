# PayFlow Ledger: payments API on PostgreSQL that publishes events to Kafka through an outbox.
image:
  repository: ghcr.io/jagadeesh-udatha/payflow-ledger

env:
  SPRING_PROFILES_ACTIVE: default
  # Every pod runs the outbox relay. Its batch query uses FOR UPDATE SKIP LOCKED, so two pods never send the
  # same row at once. Strict per-account ordering across pods would need a single relay (see INTERVIEW_NOTES).
  PAYFLOW_OUTBOX_RELAY_ENABLED: "true"

# Every replica holds up to 20 DB connections (Hikari). maxReplicas x 20 must stay under RDS max_connections.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilization: 70

pdb:
  minAvailable: 1

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 768Mi }
