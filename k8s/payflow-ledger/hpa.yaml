# Each replica holds up to 20 MySQL connections (Hikari): maxReplicas x 20 must stay under the RDS max_connections.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payflow-ledger
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: payflow-ledger }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
