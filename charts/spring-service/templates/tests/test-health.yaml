{{- if .Values.tests.enabled }}
# `helm test <release>` calls the service through its ClusterIP and expects the readiness group to be UP.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "svc.name" . }}-test-health
  labels:
    {{- include "svc.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: curl
      image: {{ .Values.tests.image }}
      command: ["sh", "-c"]
      args:
        - curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://{{ include "svc.name" . }}:{{ .Values.service.port }}{{ .Values.probes.readiness }} | grep -q '"UP"'
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
{{- end }}
