{{- if .Values.externalSecret.enabled }}
# The External Secrets Operator reads AWS Secrets Manager (through its own IRSA role) and keeps this Secret in sync.
# Nothing secret is stored in Git or in Helm release history.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "svc.name" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: {{ include "svc.name" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .envVar }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- with .property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
