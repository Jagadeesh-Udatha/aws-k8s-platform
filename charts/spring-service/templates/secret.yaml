{{- if .Values.secret.create }}
# Local and CI only. Real environments use externalSecret (AWS Secrets Manager) or an existing Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "svc.name" . }}-secrets
  labels:
    {{- include "svc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
