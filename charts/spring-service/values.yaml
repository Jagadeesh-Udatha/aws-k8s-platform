# Defaults for one Spring Boot service. Per-app values live in deploy/<app>/values.yaml,
# per-environment overrides in deploy/<app>/values-<env>.yaml.

nameOverride: ""

image:
  repository: ""            # required
  tag: ""                   # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2             # ignored when autoscaling.enabled
containerPort: 8080

# Plain configuration. Rendered into a ConfigMap and loaded with envFrom.
# Spring's relaxed binding maps SPRING_KAFKA_BOOTSTRAP_SERVERS to spring.kafka.bootstrap-servers.
env: {}

# Sensitive configuration, loaded with envFrom from one Secret. Pick one source:
secret:
  create: false             # local/dev only: write secret.data into a Secret owned by this release
  data: {}
  existingSecret: ""        # a Secret created outside Helm

# Production: the External Secrets Operator copies values from AWS Secrets Manager into the Secret.
externalSecret:
  enabled: false
  storeName: aws-secrets-manager   # ClusterSecretStore installed by the platform add-ons
  refreshInterval: 1h
  data: []                  # - envVar: DB_PASSWORD
                            #   remoteKey: payflow/prod     # Secrets Manager secret name
                            #   property: db_password       # JSON key inside it (optional)

serviceAccount:
  create: true
  annotations: {}           # e.g. eks.amazonaws.com/role-arn for IRSA

probes:
  liveness: /actuator/health/liveness
  readiness: /actuator/health/readiness
  startupFailureThreshold: 60   # x 2s = up to 2 minutes for Flyway, index creation, etc.

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 768Mi }   # no CPU limit: throttling hurts JVM startup and GC more than it helps

# Extra JVM flags. The image already sets -XX:MaxRAMPercentage=75 so the heap follows the memory limit.
javaToolOptions: "-Djava.io.tmpdir=/tmp"

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5      # lets the load balancer and kube-proxy stop routing before shutdown

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilization: 70
  scaleDownStabilizationSeconds: 300

pdb:
  enabled: true
  minAvailable: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /
  tlsSecretName: ""         # leave empty when TLS ends at the AWS ALB (certificate-arn annotation)

metrics:
  prometheusAnnotations: true
  serviceMonitor: false     # needs the Prometheus Operator CRDs

networkPolicy:
  enabled: false
  # Namespaces allowed to call this service, besides its own namespace.
  allowNamespaces: []       # - kubernetes.io/metadata.name: ingress-nginx

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

# Spread pods across zones and nodes so one AZ or node failure can't take the service down.
topologySpread:
  enabled: true
  maxSkew: 1

nodeSelector: {}
tolerations: []
affinity: {}

tests:
  enabled: true
  image: curlimages/curl:8.10.1
