# Throwaway dependencies for the kind cluster (local and CI): MySQL, Kafka (KRaft) and MongoDB.
# On AWS these are RDS for MySQL, Amazon MSK and MongoDB Atlas (see aws/create.sh).
apiVersion: apps/v1
kind: Deployment
metadata: { name: mysql, labels: { app: mysql } }
spec:
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      enableServiceLinks: false
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - { name: MYSQL_DATABASE, value: payflow }
            - { name: MYSQL_USER, value: payflow }
            - { name: MYSQL_PASSWORD, value: payflow }
            - { name: MYSQL_ROOT_PASSWORD, value: root }
          ports: [{ containerPort: 3306 }]
          readinessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-upayflow", "-ppayflow"] }
            periodSeconds: 3
          resources: { requests: { cpu: 100m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: mysql }
spec:
  selector: { app: mysql }
  ports: [{ port: 3306 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka, labels: { app: kafka } }
spec:
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      # The image turns every KAFKA_* env var into broker config, so Kubernetes' KAFKA_PORT=tcp://... would break it.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:3.8.1
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
          ports: [{ containerPort: 9092 }]
          readinessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 3
          resources: { requests: { cpu: 200m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka }
spec:
  selector: { app: kafka }
  ports: [{ port: 9092 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mongo, labels: { app: mongo } }
spec:
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      enableServiceLinks: false
      containers:
        - name: mongo
          image: mongo:7.0
          ports: [{ containerPort: 27017 }]
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"] }
            periodSeconds: 5
            timeoutSeconds: 5
          resources: { requests: { cpu: 100m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: mongo }
spec:
  selector: { app: mongo }
  ports: [{ port: 27017 }]
