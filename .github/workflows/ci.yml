name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - name: Kubernetes schemas
        run: kubeconform -strict -summary -kubernetes-version 1.33.0 k8s/ dev/deps.yaml
      - name: shellcheck
        run: shellcheck aws/*.sh dev/*.sh

  e2e-kind:
    name: End-to-end on kind
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Jagadeesh-Udatha/payflow-ledger
          path: apps/payflow-ledger
      - uses: actions/checkout@v4
        with:
          repository: Jagadeesh-Udatha/telemetry-stream
          path: apps/telemetry-stream
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          for app in payflow-ledger telemetry-stream; do
            docker buildx build --load -t $app:ci \
              --cache-from type=gha,scope=$app --cache-to type=gha,mode=max,scope=$app \
              apps/$app
          done
      - uses: helm/kind-action@v1
        with:
          cluster_name: platform
          config: dev/kind.yaml
      - name: Load images into kind
        run: |
          kind load docker-image payflow-ledger:ci --name platform
          kind load docker-image telemetry-stream:ci --name platform
      - name: Deploy dependencies and both services (kubectl apply)
        run: ./dev/up.sh
      - name: Smoke test
        run: ./dev/smoke.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n platform get all -o wide || true
          kubectl -n platform describe pods || true
          for d in payflow-ledger telemetry-stream kafka mysql mongo; do
            echo "::group::logs $d"; kubectl -n platform logs deploy/$d --all-containers --tail=200 || true; echo "::endgroup::"
          done
          kubectl -n platform get events --sort-by=.lastTimestamp || true
