# Manual deploy of one service to EKS: runs aws/deploy.sh (build, push to ECR, kubectl rollout).
# Needs the repository variable AWS_DEPLOY_ROLE_ARN: an IAM role GitHub can assume through OIDC (see README).
name: Deploy
on:
  workflow_dispatch:
    inputs:
      app:
        type: choice
        options: [payflow-ledger, telemetry-stream]
      ref:
        description: App repository branch, tag or SHA
        default: main

permissions:
  contents: read
  id-token: write # for the AWS OIDC login

concurrency:
  group: deploy-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Jagadeesh-Udatha/${{ inputs.app }}
          ref: ${{ inputs.ref }}
          path: app
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - run: ./aws/deploy.sh "${{ inputs.app }}" app
